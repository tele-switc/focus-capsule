name: Build Flutter APK

# 仅用于手动验证；正式 APK 由 release.yml 发布。

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: focus_capsule_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: focus_capsule_flutter
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: focus-capsule-flutter-apk
          path: focus_capsule_flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
