name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "focus_capsule/**"
      - "assets/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    env:
      WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      WINDOWS_SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run reliability tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Validate packaging helpers
        shell: pwsh
        run: |
          python -m compileall -q packaging
          python packaging/generate_version_info.py --check

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Import Windows signing certificate
        if: env.WINDOWS_CERTIFICATE_BASE64 != ''
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "focus-capsule-signing.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
          "WINDOWS_SIGN_PFX=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build application and installer
        shell: pwsh
        run: >
          ./packaging/build_windows.ps1
          -Python python
          -SkipDependencyInstall

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: focus-capsule-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    runs-on: macos-latest
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      BUILD_KEYCHAIN_PASSWORD: temporary-ci-keychain-password
      BUILD_KEYCHAIN_PATH: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run reliability tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Validate packaging helpers
        run: |
          python -m compileall -q packaging
          python packaging/generate_version_info.py --check

      - name: Import Apple Developer ID certificate
        if: env.MACOS_CERTIFICATE_BASE64 != ''
        run: |
          CERTIFICATE_PATH="${RUNNER_TEMP}/focus-capsule-signing.p12"
          KEYCHAIN_PATH="${RUNNER_TEMP}/focus-capsule-build.keychain-db"
          echo "${MACOS_CERTIFICATE_BASE64}" | base64 -D > "${CERTIFICATE_PATH}"
          security create-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "${BUILD_KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security import "${CERTIFICATE_PATH}" \
            -P "${MACOS_CERTIFICATE_PASSWORD}" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "${KEYCHAIN_PATH}"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "${BUILD_KEYCHAIN_PASSWORD}" \
            "${KEYCHAIN_PATH}"
          security list-keychains -d user -s "${KEYCHAIN_PATH}" login.keychain-db
          echo "BUILD_KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "${GITHUB_ENV}"

      - name: Build application and DMG
        run: |
          BUILD_PYTHON="$(command -v python)" \
          SKIP_DEPENDENCY_INSTALL=1 \
          bash packaging/build_macos.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: focus-capsule-macos
          path: |
            dist/dmg/*.dmg
            dist/dmg/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keychain
        if: always() && env.BUILD_KEYCHAIN_PATH != ''
        run: security delete-keychain "${BUILD_KEYCHAIN_PATH}"
