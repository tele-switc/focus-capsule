name: Build desktop installers

# 仅用于 PR / 手动验证构建可用性；正式产物由 release.yml 在打 tag 时发布。

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "focus_capsule/**"
      - "assets/**"
      - "packaging/**"
      - "requirements*.txt"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run reliability tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import unittest; loader = unittest.TestLoader(); suite = loader.discover('tests', pattern='test_core*.py'); suite.addTests(loader.discover('tests', pattern='test_packaging*.py')); suite.addTests(loader.discover('tests', pattern='test_icon_catalog*.py')); suite.addTests(loader.discover('tests', pattern='test_schedule*.py')); runner = unittest.TextTestRunner(verbosity=2); runner.run(suite)"

      - name: Validate packaging helpers
        shell: pwsh
        run: |
          python -m compileall -q packaging
          python packaging/generate_version_info.py --check

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build application and installer
        shell: pwsh
        run: >
          ./packaging/build_windows.ps1
          -Python python
          -SkipDependencyInstall

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: focus-capsule-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS DMG
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run reliability tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import unittest; loader = unittest.TestLoader(); suite = loader.discover('tests', pattern='test_core*.py'); suite.addTests(loader.discover('tests', pattern='test_packaging*.py')); suite.addTests(loader.discover('tests', pattern='test_icon_catalog*.py')); suite.addTests(loader.discover('tests', pattern='test_schedule*.py')); runner = unittest.TextTestRunner(verbosity=2); runner.run(suite)"

      - name: Validate packaging helpers
        run: |
          python -m compileall -q packaging
          python packaging/generate_version_info.py --check

      - name: Build application and DMG
        run: |
          BUILD_PYTHON="$(command -v python)" \
          SKIP_DEPENDENCY_INSTALL=1 \
          bash packaging/build_macos.sh

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: focus-capsule-macos
          path: |
            dist/dmg/*.dmg
            dist/dmg/*.sha256
          if-no-files-found: error
          retention-days: 14
