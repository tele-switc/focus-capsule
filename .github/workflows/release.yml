name: Release

# 打 tag（v*）时一次性构建三端产物并发布 GitHub Release。
# 之前只有 tag 触发构建、却没有任何工作流创建 Release，
# 导致 README 里的下载链接全部 404——这个文件就是来补这一环的。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（留空则用当前 commit）"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "17"
  FLUTTER_VERSION: "stable"

jobs:
  windows:
    name: Windows x64 安装包
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: 安装构建依赖
        run: python -m pip install -r requirements-build.txt

      - name: 跑可靠性测试
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --timeout=180 --timeout-method=thread

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 构建程序与安装包
        shell: pwsh
        run: ./packaging/build_windows.ps1 -Python python -SkipDependencyInstall

      - name: 校验安装包非空
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist/installer -Filter *.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "未生成安装包"; exit 1 }
          $size = [math]::Round($exe.Length / 1MB, 2)
          if ($exe.Length -lt 1MB) { Write-Error "安装包过小（$size MB）"; exit 1 }
          Write-Host "安装包 $size MB : $($exe.Name)"
          Get-FileHash -Algorithm SHA256 $exe.FullName | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS DMG（Apple Silicon）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: 安装构建依赖
        run: python -m pip install -r requirements-build.txt

      - name: 跑可靠性测试
        # macOS runner 上的 GUI 渲染用例会挂；失败在这里只作信号，
        # 不阻塞产物——同一套用例在 Windows job 里是硬门禁。
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q --timeout=60 --timeout-method=thread

      - name: 构建程序与 DMG
        env:
          SKIP_DEPENDENCY_INSTALL: "1"
        run: |
          BUILD_PYTHON="$(command -v python)" bash packaging/build_macos.sh

      - name: 校验 DMG 非空
        run: |
          shopt -s nullglob
          files=(dist/dmg/*.dmg)
          if [ ${#files[@]} -eq 0 ]; then echo "未生成 DMG" >&2; exit 1; fi
          ls -lh "${files[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 依赖与静态检查
        working-directory: focus_capsule_flutter
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 构建 APK
        working-directory: focus_capsule_flutter
        run: flutter build apk --release --split-per-abi

      - name: 整理产物名
        run: |
          mkdir -p out
          src=focus_capsule_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if [ ! -f "$src" ]; then echo "缺少 arm64 APK" >&2; exit 1; fi
          version="$(grep -m1 '^version:' focus_capsule_flutter/pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)"
          cp "$src" "out/Focus-Capsule-${version}-Android-arm64-v8a.apk"
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: 发布 GitHub Release
    needs: [windows, macos, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: 生成校验和与发布说明
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          echo "发布 tag: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Focus Capsule $TAG" \
              --generate-notes
          fi
          gh release view "$TAG"
