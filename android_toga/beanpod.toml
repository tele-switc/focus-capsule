# Beanpod config for Focus Capsule Android
# https://docs.beeware.org/en/latest/deploying/android.html

[package]
name = "focus-capsule-android"
source_dir = "."
version = "2.1.0"
license = "MIT"

[dependencies]
toga = ">=0.5.0"
toga-android = ">=0.5.0"
psutil = ">=7.0.0"

[android]
min_sdk = 26
target_sdk = 35
compile_sdk = 35
ndk_version = "25.2.9519653"
gradle_version = "8.5"

[android.permissions]
foreground_service = true
notification = true
wake_lock = true
