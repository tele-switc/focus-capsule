plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Block all jcenter/bintray references at the project level
allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://repo.maven.apache.org/maven2' }
    }
}

android {
    namespace = "com.focuscapsule.android"
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.focuscapsule.android"
        minSdk = 26
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = "3.2.1"
    }

    buildTypes {
        release {
            // Intentionally unsigned. A distribution keystore can be added by
            // whoever publishes the APK later.
        }
    }
}

flutter {
    source = "../.."
}

